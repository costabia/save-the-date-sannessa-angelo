<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f0e5" />
    <title>Save the Date</title>
    <meta name="description" content="Save the Date" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://save-the-date-sannessa-angelo.vercel.app/" />
    <meta property="og:title" content="Save the Date" />
    <meta property="og:description" content="Save the Date" />
    <meta property="og:image" content="https://save-the-date-sannessa-angelo.vercel.app/assets/capa@2x.png" />
    <meta property="og:image:url" content="https://save-the-date-sannessa-angelo.vercel.app/assets/capa@2x.png" />
    <meta property="og:image:secure_url" content="https://save-the-date-sannessa-angelo.vercel.app/assets/capa@2x.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="3841" />
    <meta property="og:image:height" content="2161" />
    <meta property="og:image:alt" content="Save the Date de Sannessa e Angelo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Save the Date" />
    <meta name="twitter:description" content="Save the Date" />
    <meta name="twitter:image" content="https://save-the-date-sannessa-angelo.vercel.app/assets/capa@2x.png" />
    <link rel="canonical" href="https://save-the-date-sannessa-angelo.vercel.app/" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <section class="screen intro intro--route-1" id="intro-route-1" aria-label="Capa da primeira opção">
        <button class="screen-hit-area" type="button" aria-label="Abrir convite">
          <img src="assets/nomes.svg" alt="Nomes dos noivos" class="intro-names" />
          <div class="cover-lockup cover-lockup--route-1">
            <picture>
              <source media="(min-width: 761px)" srcset="assets/monogramaverde.svg" />
              <img src="assets/monograma.svg" alt="Monograma" class="monogram" />
            </picture>
            <picture>
              <source media="(min-width: 761px)" srcset="assets/savethedateverde.svg" />
              <img src="assets/savethedate.svg" alt="Save the Date" class="save-the-date" />
            </picture>
          </div>
          <img src="assets/envelopefechado.png" alt="Envelope fechado" class="cover-envelope cover-envelope--route-1" />
          <img src="assets/cliqueparaabrir.svg" alt="Clique para abrir" class="open-prompt" />
        </button>
      </section>

      <section class="screen detail detail--route-1" id="detail-route-1" aria-label="Convite da primeira opção">
        <div class="detail-inner">
          <header class="brand-lockup">
            <img src="assets/monograma.svg" alt="Monograma" class="monogram" />
            <img src="assets/savethedate.svg" alt="Save the Date" class="save-the-date" />
          </header>
          <div class="composition composition--route-1" aria-label="Envelope e convite">
            <img src="assets/flor1@2x.png" alt="" class="piece piece-flower flower-one" />
            <img src="assets/flor2@2x.png" alt="" class="piece piece-flower flower-two" />
            <img src="assets/envelopefechado.png" alt="Envelope fechado" class="piece envelope" />
            <img src="assets/convite@2x.png" alt="Convite" class="piece invitation" />
          </div>
        </div>
      </section>

      <section class="screen intro intro--route-2" id="intro-route-2" aria-label="Capa da segunda opção">
        <button class="screen-hit-area" type="button" aria-label="Abrir convite">
          <div class="cover-lockup">
            <picture>
              <source media="(min-width: 761px)" srcset="assets/monogramaverde.svg" />
              <img src="assets/monograma.svg" alt="Monograma" class="monogram" />
            </picture>
            <picture>
              <source media="(min-width: 761px)" srcset="assets/savethedateverde.svg" />
              <img src="assets/savethedate.svg" alt="Save the Date" class="save-the-date" />
            </picture>
          </div>
          <img src="assets/envelopefechado.png" alt="Envelope fechado" class="cover-envelope" />
          <picture class="open-prompt-picture">
            <source media="(min-width: 761px)" srcset="assets/cliqueparaabrir.svg" />
            <img src="assets/cliqueparaabrirbranco.svg" alt="Clique para abrir" class="open-prompt" />
          </picture>
        </button>
      </section>

      <section class="screen detail detail--route-2" id="detail-route-2" aria-label="Convite da segunda opção">
        <div class="detail-inner">
          <header class="brand-lockup brand-lockup--green">
            <img src="assets/monogramaverde.svg" alt="Monograma" class="monogram" />
            <img src="assets/savethedateverde.svg" alt="Save the Date" class="save-the-date" />
          </header>
          <div class="composition composition--route-2" aria-label="Envelope aberto e convite">
            <img src="assets/floroutline@2x.png" alt="" class="piece piece-flower outline-flower" />
            <img src="assets/chave@2x.png" alt="" class="piece piece-key" />
            <img src="assets/taças@2x.png" alt="" class="piece piece-glasses" />
            <img src="assets/cera@2x.png" alt="" class="piece piece-wax" />
            <img src="assets/fechadura@2x.png" alt="" class="piece piece-lock" />
            <img src="assets/envelopeaberto@2x.png" alt="Envelope aberto" class="piece envelope" />
            <img src="assets/convite-opcao2@2x.png" alt="Convite" class="piece invitation" />
          </div>
          <button class="calendar-button calendar-button--route-2" type="button" aria-label="Salvar na agenda">
            <img src="assets/salvarnagenda.svg" alt="Salvar na agenda" />
          </button>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>

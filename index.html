    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />

    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1920" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="image" content="https://tauany-gabriel-save-the-date-20-11.vercel.app/assets/capa_opcao1.jpg" />
    <link rel="canonical" href="https://tauany-gabriel-save-the-date-20-11.vercel.app/" />
    <link rel="image_src" href="https://tauany-gabriel-save-the-date-20-11.vercel.app/assets/capa_opcao1.jpg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <section class="screen intro screen--active" id="intro" aria-label="Abertura do convite">
        <div class="intro-assets">
          <img src="assets/Ativo 3.svg" alt="" class="asset asset-3" />
          <img src="assets/Ativo 4.svg" alt="Tauany e Gabriel" class="asset asset-4" />
          <img src="assets/Ativo 1.svg" alt="" class="asset asset-1" />
          <img src="assets/Ativo 5.svg" alt="" class="asset asset-5" />
        </div>
      </section>

      <section class="screen detail detail--route-1" id="detail-route-1" aria-label="Convite aberto">
        <div class="detail-inner">
          <img src="assets/Ativo 4.svg" alt="Tauany e Gabriel" class="asset detail-4" />
          <div class="invitation-composition invitation-composition--open" aria-label="Convite aberto com envelope, fonte e cachorros">
            <img src="assets/envelope abeerto.png" alt="" class="composition-layer composition-envelope" />
            <img src="assets/fontee.png" alt="" class="composition-layer composition-fountain" />
            <img src="assets/Ativo 6 HD.png" alt="Convite de Tauany e Gabriel" class="composition-layer composition-card" />
            <img src="assets/Ativo 9.svg" alt="" class="composition-layer composition-dog composition-dog--top" />
            <img src="assets/Ativo 8.svg" alt="" class="composition-layer composition-dog composition-dog--bottom" />
          </div>
          <button class="calendar-button" type="button" aria-label="Criar evento na agenda">
            <img src="assets/Ativo 15.png" alt="Criar evento na agenda" />
          </button>
        </div>
      </section>

      <section class="screen detail detail--route-2" id="detail-route-2" aria-label="Detalhes do convite">
        <div class="detail-inner detail-inner--route-2">
          <img src="assets/Ativo 4.svg" alt="Tauany e Gabriel" class="asset detail-4" />
          <div class="invitation-composition invitation-composition--closed" aria-label="Convite fechado com envelope, fonte e cachorros">
            <img src="assets/Ativo 1.svg" alt="" class="composition-layer composition-envelope" />
            <img src="assets/fontee.png" alt="" class="composition-layer composition-fountain" />
            <img src="assets/Ativo 6 HD.png" alt="Convite de Tauany e Gabriel" class="composition-layer composition-card" />
            <img src="assets/Ativo 9.svg" alt="" class="composition-layer composition-dog composition-dog--top" />
            <img src="assets/Ativo 8.svg" alt="" class="composition-layer composition-dog composition-dog--bottom" />
          </div>
          <button class="calendar-button" type="button" aria-label="Criar evento na agenda">
            <img src="assets/botao2.svg" alt="Salvar na agenda" />
          </button>
          <div class="bottom-art" aria-label="Ilustração do local">
            <img src="assets/Ativo 12.svg" alt="Jardim e fonte" class="asset detail-12" />
            <img src="assets/Ativo 13.svg" alt="" class="asset detail-13-overlay" />
          </div>
        </div>
      </section>

      <section class="screen detail detail--route-2 detail--route-3" id="detail-route-3" aria-label="Detalhes alternativos do convite">
        <div class="detail-inner detail-inner--route-2">
          <img src="assets/Ativo 4.svg" alt="Tauany e Gabriel" class="asset detail-4" />
          <div class="invitation-composition invitation-composition--closed" aria-label="Convite fechado com envelope estampado e fonte">
            <img src="assets/envelopecomestampa.svg" alt="" class="composition-layer composition-envelope" />
            <img src="assets/fontee.png" alt="" class="composition-layer composition-fountain" />
            <img src="assets/Ativo 6 HD.png" alt="Convite de Tauany e Gabriel" class="composition-layer composition-card" />
          </div>
          <button class="calendar-button" type="button" aria-label="Criar evento na agenda">
            <img src="assets/botao2.svg" alt="Salvar na agenda" />
          </button>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>

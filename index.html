<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Tauany e Gabriel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <section class="screen intro screen--active" id="intro" aria-label="Abertura do convite">
        <div class="intro-assets">
          <img src="assets/Ativo 3.svg" alt="" class="asset asset-3" />
          <img src="assets/Ativo 4.svg" alt="Tauany e Gabriel" class="asset asset-4" />
          <img src="assets/Ativo 1.svg" alt="" class="asset asset-1" />
          <img src="assets/Ativo 5.svg" alt="" class="asset asset-5" />
        </div>
      </section>

      <section class="screen detail detail--route-1" id="detail-route-1" aria-label="Convite aberto">
        <div class="detail-inner">
          <img src="assets/Ativo 4.svg" alt="Tauany e Gabriel" class="asset detail-4" />
          <img src="assets/Ativo 14.png" alt="Convite com envelope e jardim" class="asset detail-14" />
          <button class="calendar-button" type="button" aria-label="Criar evento na agenda">
            <img src="assets/Ativo 15.png" alt="Criar evento na agenda" />
          </button>
        </div>
      </section>

      <section class="screen detail detail--route-2" id="detail-route-2" aria-label="Detalhes do convite">
        <div class="detail-inner detail-inner--route-2">
          <img src="assets/Ativo 4.svg" alt="Tauany e Gabriel" class="asset detail-4" />
          <img src="assets/Ativo 16.png" alt="Envelope e convite" class="asset detail-16" />
          <button class="calendar-button" type="button" aria-label="Criar evento na agenda">
            <img src="assets/Ativo 15.png" alt="Criar evento na agenda" />
          </button>
          <div class="bottom-art" aria-label="Ilustração do local">
            <img src="assets/Ativo 12.svg" alt="Jardim e fonte" class="asset detail-12" />
            <img src="assets/Ativo 13.svg" alt="" class="asset detail-13-overlay" />
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
